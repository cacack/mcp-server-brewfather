name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Authenticate via a dedicated GitHub App (token minted at job time) rather
# than GITHUB_TOKEN. Events generated by the default GITHUB_TOKEN do not
# trigger downstream workflows, so the tag release-please pushes would never
# run release.yml (PyPI publish). App-minted tokens are treated as first-class
# actors and do trigger downstream workflows.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps the version in pyproject.toml but not uv.lock, and
      # the lock records the root project's own version, so `uv sync --locked`
      # fails on the release PR — and on main once it merges.
      #
      # Find the open release PR directly rather than using the action's `pr`
      # output: that output is set only when release-please creates or updates
      # a PR. A commit of a hidden changelog type (ci, chore, docs) leaves the
      # PR unchanged — no output — while still rebuilding the release branch on
      # top of the new main, which drops any earlier lock-sync commit.
      #
      # `--repo` is required: no checkout has happened, so gh has no remote.
      - id: release_pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch=$(gh pr list --repo "${{ github.repository }}" --state open --limit 100 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefName // ""')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.release_pr.outputs.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release_pr.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}

      - if: ${{ steps.release_pr.outputs.branch }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Idempotent: when the lock is already in sync nothing is pushed.
      - if: ${{ steps.release_pr.outputs.branch }}
        name: Sync uv.lock with the bumped version
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock already in sync; nothing to push."
            exit 0
          fi
          git config user.name "release-please[bot]"
          git config user.email "release-please[bot]@users.noreply.github.com"
          git commit -m "chore: sync uv.lock with release version" -- uv.lock
          git push
